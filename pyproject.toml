[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "broutegpt"
version = "0.2.0"
description = "Zero-cost multi-provider LLM router, multimodal chatbot, and autonomous Decision-Point coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
docs = [
    "pymupdf>=1.24.0",
    "weasyprint>=61.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    "markdown>=3.6",
]

[project.scripts]
broutegpt = "broutegpt_core.cli:main"

[tool.setuptools]
py-modules = ["broutegpt"]
packages = ["broutegpt_core", "broutegpt_agent"]

